<script>
let lesson = null;
let currentSection = 0;
let sections = [];

document.addEventListener('DOMContentLoaded', async () => {
    const params = Utils.getQueryParams();
    const lessonId = params.id;
    
    if (!lessonId) {
        showError();
        return;
    }
    
    await loadLesson(lessonId);
    setupEventListeners();
});

async function loadLesson(id) {
    try {
        const result = await API.getLesson(id);
        
        if (!result.success || !result.data) {
            showError();
            return;
        }
        
        lesson = result.data;
        renderLesson();
        
        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('lesson-content').classList.remove('hidden');
        
    } catch (error) {
        console.error('Failed to load lesson:', error);
        showError();
    }
}

function showError() {
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('error-state').classList.remove('hidden');
}

function renderLesson() {
    // Update header
    document.getElementById('breadcrumb-title').textContent = lesson.title || lesson.topic;
    document.getElementById('lesson-title').textContent = lesson.title || lesson.topic;
    document.getElementById('lesson-subject').textContent = Utils.capitalize(lesson.subject);
    document.getElementById('lesson-subject').className = `badge badge-${lesson.subject}`;
    document.getElementById('lesson-difficulty').textContent = Utils.capitalize(lesson.difficulty);
    document.getElementById('lesson-date').textContent = lesson.created_at ? Utils.formatDate(lesson.created_at) : 'Recently';
    document.getElementById('lesson-read-time').textContent = Utils.readingTime(lesson.content || '');
    
    // Update complete button
    if (lesson.completed) {
        const btn = document.getElementById('mark-complete-btn');
        btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg><span>Completed</span>';
        btn.classList.remove('btn-success');
        btn.classList.add('btn-secondary');
        btn.disabled = true;
    }
    
    // Render content
    const content = lesson.content || '';
    const rendered = MarkdownRenderer.render(content);
    document.getElementById('lesson-body').innerHTML = rendered;
    
    // Render math
    MathRenderer.renderElement(document.getElementById('lesson-body'));
    
    // Generate table of contents
    generateTOC();
    
    // Extract key concepts
    extractKeyConcepts();
    
    // Load related lessons
    loadRelatedLessons();
    
    // Update progress
    updateProgress();
}

function generateTOC() {
    const content = document.getElementById('lesson-body');
    const headings = content.querySelectorAll('h2, h3');
    const toc = document.getElementById('table-of-contents');
    
    if (headings.length === 0) {
        toc.innerHTML = '<p class="p-4 text-sm text-gray-500">No sections available</p>';
        return;
    }
    
    sections = Array.from(headings);
    toc.innerHTML = sections.map((heading, index) => {
        const isH3 = heading.tagName === 'H3';
        heading.id = `section-${index}`;
        return `
            <a href="#section-${index}" class="block px-4 py-3 text-sm hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors ${isH3 ? 'pl-8' : ''}" data-section="${index}">
                ${Utils.escapeHtml(heading.textContent)}
            </a>
        `;
    }).join('');
    
    // Add click handlers
    toc.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const section = parseInt(link.dataset.section);
            goToSection(section);
        });
    });
}

function extractKeyConcepts() {
    const content = lesson.content || '';
    const concepts = document.getElementById('key-concepts');
    
    // Extract bold text and important terms
    const boldMatches = content.match(/\*\*([^*]+)\*\*/g) || [];
    const uniqueConcepts = [...new Set(boldMatches.map(m => m.replace(/\*\*/g, '')))].slice(0, 8);
    
    if (uniqueConcepts.length === 0) {
        concepts.innerHTML = '<li class="text-gray-500">Key concepts will appear here</li>';
        return;
    }
    
    concepts.innerHTML = uniqueConcepts.map(concept => `
        <li class="flex items-start gap-2">
            <svg class="w-4 h-4 text-primary-500 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
            </svg>
            <span>${Utils.escapeHtml(concept)}</span>
        </li>
    `).join('');
}

async function loadRelatedLessons() {
    const container = document.getElementById('related-lessons');
    
    try {
        const result = await API.getLessons({ subject: lesson.subject });
        
        if (result.success && result.data) {
            const related = result.data
                .filter(l => l.id !== lesson.id)
                .slice(0, 3);
            
            if (related.length === 0) {
                container.innerHTML = '<p class="p-4 text-sm text-gray-500">No related lessons</p>';
                return;
            }
            
            container.innerHTML = related.map(l => `
                <a href="lesson-view.html?id=${l.id}" class="block px-4 py-3 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">
                    <div class="font-medium text-sm truncate">${Utils.escapeHtml(l.title || l.topic)}</div>
                    <div class="text-xs text-gray-500 mt-1">${Utils.capitalize(l.difficulty)}</div>
                </a>
            `).join('');
        }
    } catch (error) {
        container.innerHTML = '<p class="p-4 text-sm text-gray-500">Failed to load</p>';
    }
}

function goToSection(index) {
    if (index >= 0 && index < sections.length) {
        currentSection = index;
        sections[index].scrollIntoView({ behavior: 'smooth', block: 'start' });
        updateProgress();
    }
}

function updateProgress() {
    const total = Math.max(1, sections.length);
    const progress = Math.round(((currentSection + 1) / total) * 100);
    
    document.getElementById('progress-bar').style.width = progress + '%';
    document.getElementById('progress-text').textContent = progress + '%';
    
    // Update navigation buttons
    document.getElementById('prev-section').disabled = currentSection === 0;
    document.getElementById('next-section').disabled = currentSection >= sections.length - 1;
}

function setupEventListeners() {
    // Navigation
    document.getElementById('prev-section').addEventListener('click', () => {
        goToSection(currentSection - 1);
    });
    
    document.getElementById('next-section').addEventListener('click', () => {
        goToSection(currentSection + 1);
    });
    
    // Mark complete
    document.getElementById('mark-complete-btn').addEventListener('click', async () => {
        try {
            const result = await API.markLessonCompleted(lesson.id);
            if (result.success) {
                Notifications.success('Lesson Completed!', 'Great job finishing this lesson!');
                const btn = document.getElementById('mark-complete-btn');
                btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg><span>Completed</span>';
                btn.classList.remove('btn-success');
                btn.classList.add('btn-secondary');
                btn.disabled = true;
            }
        } catch (error) {
            Notifications.error('Error', 'Failed to mark lesson as complete');
        }
    });
    
    // Take quiz
    document.getElementById('take-quiz-btn').addEventListener('click', () => {
        window.location.href = `quiz.html?subject=${lesson.subject}&topic=${encodeURIComponent(lesson.topic || lesson.title)}`;
    });
    
    // More menu
    document.getElementById('more-btn').addEventListener('click', () => {
        document.getElementById('more-dropdown').classList.toggle('hidden');
    });
    
    document.addEventListener('click', (e) => {
        if (!document.getElementById('more-menu').contains(e.target)) {
            document.getElementById('more-dropdown').classList.add('hidden');
        }
    });
    
    // Generate flashcards
    document.getElementById('generate-flashcards').addEventListener('click', () => {
        window.location.href = `flashcards.html?subject=${lesson.subject}&topic=${encodeURIComponent(lesson.topic || lesson.title)}`;
    });
    
    // Ask tutor
    document.getElementById('ask-tutor').addEventListener('click', () => {
        window.location.href = `chat.html?context=${encodeURIComponent(lesson.topic || lesson.title)}`;
    });
    
    // Delete lesson
    document.getElementById('delete-lesson').addEventListener('click', async () => {
        if (confirm('Are you sure you want to delete this lesson?')) {
            try {
                const result = await API.deleteLesson(lesson.id);
                if (result.success) {
                    Notifications.success('Deleted', 'Lesson has been deleted');
                    window.location.href = 'lessons.html';
                }
            } catch (error) {
                Notifications.error('Error', 'Failed to delete lesson');
            }
        }
    });
    
    // Track scroll progress
    window.addEventListener('scroll', Utils.throttle(() => {
        if (sections.length === 0) return;
        
        const scrollPos = window.scrollY + 100;
        for (let i = sections.length - 1; i >= 0; i--) {
            if (sections[i].offsetTop <= scrollPos) {
                if (currentSection !== i) {
                    currentSection = i;
                    updateProgress();
                }
                break;
            }
        }
    }, 100));
}
</script>
