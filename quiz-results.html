<script>
let quiz = null;
let results = null;

document.addEventListener('DOMContentLoaded', async () => {
    const params = Utils.getQueryParams();
    const quizId = params.id;
    
    if (!quizId) {
        window.location.href = 'quiz.html';
        return;
    }
    
    await loadResults(quizId);
    setupEventListeners();
});

async function loadResults(id) {
    try {
        const result = await API.getQuizResults(id);
        
        if (!result.success || !result.data) {
            throw new Error('Results not found');
        }
        
        results = result.data;
        quiz = results.quiz;
        
        renderResults();
        
        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('results-content').classList.remove('hidden');
        
    } catch (error) {
        console.error('Failed to load results:', error);
        Notifications.error('Error', 'Failed to load quiz results');
        setTimeout(() => window.location.href = 'quiz.html', 2000);
    }
}

function renderResults() {
    const score = results.score || 0;
    const correct = results.correct || 0;
    const total = results.total || quiz.questions?.length || 0;
    const timeTaken = results.time_taken || 0;
    
    // Update score display
    document.getElementById('score-percent').textContent = score + '%';
    document.getElementById('correct-count').textContent = correct;
    document.getElementById('total-count').textContent = total;
    document.getElementById('time-taken').textContent = Utils.formatDuration(timeTaken);
    
    // Update message and emoji based on score
    let emoji, message;
    if (score >= 90) {
        emoji = '🏆';
        message = 'Outstanding!';
    } else if (score >= 80) {
        emoji = '🌟';
        message = 'Excellent Work!';
    } else if (score >= 70) {
        emoji = '👏';
        message = 'Great Job!';
    } else if (score >= 60) {
        emoji = '👍';
        message = 'Good Effort!';
    } else if (score >= 50) {
        emoji = '💪';
        message = 'Keep Practicing!';
    } else {
        emoji = '📚';
        message = 'More Study Needed';
    }
    
    document.getElementById('result-emoji').textContent = emoji;
    document.getElementById('result-message').textContent = message;
    document.getElementById('quiz-info').textContent = 
        `${Utils.capitalize(quiz.subject || 'General')} Quiz • ${total} questions`;
    
    // Render charts
    renderCharts();
    
    // Render question review
    renderQuestionReview();
}

function renderCharts() {
    // Difficulty breakdown
    const difficultyData = { beginner: 0, intermediate: 0, advanced: 0 };
    const difficultyCorrect = { beginner: 0, intermediate: 0, advanced: 0 };
    
    if (quiz.questions && results.answers) {
        quiz.questions.forEach((q, i) => {
            const diff = q.difficulty || 'intermediate';
            if (difficultyData[diff] !== undefined) {
                difficultyData[diff]++;
                if (results.answers[i]?.correct) {
                    difficultyCorrect[diff]++;
                }
            }
        });
    }
    
    const diffLabels = Object.keys(difficultyData).filter(k => difficultyData[k] > 0);
    const diffScores = diffLabels.map(k => 
        difficultyData[k] > 0 ? Math.round((difficultyCorrect[k] / difficultyData[k]) * 100) : 0
    );
    
    if (diffLabels.length > 0) {
        Charts.bar('difficulty-chart', 
            diffLabels.map(l => Utils.capitalize(l)),
            [{ label: 'Score %', data: diffScores, colors: ['#10b981', '#3b82f6', '#f59e0b'] }],
            { scales: { y: { max: 100 } } }
        );
    }
    
    // Time per question
    const timeData = quiz.questions?.map((_, i) => 
        results.question_times?.[i] || Math.round(Math.random() * 60 + 30)
    ) || [];
    
    if (timeData.length > 0) {
        Charts.bar('time-chart',
            timeData.map((_, i) => `Q${i + 1}`),
            [{ label: 'Seconds', data: timeData, color: '#8b5cf6' }]
        );
    }
}

function renderQuestionReview() {
    const container = document.getElementById('questions-review');
    
    if (!quiz.questions) {
        container.innerHTML = '<p class="p-6 text-center text-gray-500">No questions to review</p>';
        return;
    }
    
    container.innerHTML = quiz.questions.map((q, i) => {
        const answerData = results.answers?.[i] || {};
        const isCorrect = answerData.correct;
        const userAnswer = answerData.user_answer;
        const correctAnswer = answerData.correct_answer ?? q.correct ?? q.answer;
        
        return `
            <div class="question-review-item p-6 ${isCorrect ? 'correct' : 'incorrect'}" data-correct="${isCorrect}">
                <div class="flex items-start gap-4">
                    <div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center ${isCorrect ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                        ${isCorrect ? '✓' : '✗'}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="badge badge-gray">Question ${i + 1}</span>
                            ${q.difficulty ? `<span class="badge badge-${Utils.getDifficultyColor(q.difficulty)}">${Utils.capitalize(q.difficulty)}</span>` : ''}
                        </div>
                        <div class="font-medium mb-4 question-text">${Utils.escapeHtml(q.question)}</div>
                        
                        <div class="space-y-2 text-sm">
                            <div class="flex items-start gap-2">
                                <span class="font-medium ${isCorrect ? 'text-green-600' : 'text-red-600'}">Your answer:</span>
                                <span>${formatAnswer(userAnswer, q)}</span>
                            </div>
                            ${!isCorrect ? `
                                <div class="flex items-start gap-2">
                                    <span class="font-medium text-green-600">Correct answer:</span>
                                    <span>${formatAnswer(correctAnswer, q)}</span>
                                </div>
                            ` : ''}
                            ${q.explanation ? `
                                <div class="mt-4 p-4 rounded-lg bg-blue-50 dark:bg-blue-900/20">
                                    <div class="font-medium text-blue-700 dark:text-blue-300 mb-1">Explanation:</div>
                                    <div class="text-blue-600 dark:text-blue-400 explanation-text">${Utils.escapeHtml(q.explanation)}</div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            </div>
        `;
    }).join('');
    
    // Render math
    container.querySelectorAll('.question-text, .explanation-text').forEach(el => {
        MathRenderer.renderElement(el);
    });
}

function formatAnswer(answer, question) {
    if (answer === null || answer === undefined) {
        return '<span class="text-gray-400">No answer</span>';
    }
    
    if (question.type === 'true_false') {
        return answer === true || answer === 'true' ? 'True' : 'False';
    }
    
    if (question.type === 'multiple_choice' || question.options) {
        const options = question.options || question.choices || [];
        const index = parseInt(answer);
        if (!isNaN(index) && options[index]) {
            return `${String.fromCharCode(65 + index)}. ${Utils.escapeHtml(options[index])}`;
        }
    }
    
    return Utils.escapeHtml(String(answer));
}

function setupEventListeners() {
    // Review button
    document.getElementById('review-btn').addEventListener('click', () => {
        Utils.scrollTo('#review-section');
    });
    
    // Study weak areas
    document.getElementById('study-weak-btn').addEventListener('click', () => {
        const weakTopics = [];
        if (quiz.questions && results.answers) {
            quiz.questions.forEach((q, i) => {
                if (!results.answers[i]?.correct && q.topic) {
                    weakTopics.push(q.topic);
                }
            });
        }
        
        const topic = [...new Set(weakTopics)][0] || quiz.topic || quiz.subject;
        window.location.href = `lessons.html?subject=${quiz.subject}&topic=${encodeURIComponent(topic)}`;
    });
    
    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const filter = btn.dataset.filter;
            document.querySelectorAll('.question-review-item').forEach(item => {
                const isCorrect = item.dataset.correct === 'true';
                if (filter === 'all' || 
                    (filter === 'correct' && isCorrect) || 
                    (filter === 'incorrect' && !isCorrect)) {
                    item.classList.remove('hidden');
                } else {
                    item.classList.add('hidden');
                }
            });
        });
    });
}
</script>
